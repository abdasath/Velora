{% extends "auth.html" %}
{% block title %} Login {% endblock title %}
{% block form %}

<h1 class="text-center">Login</h1>
<div class="card p-3 rounded-4">

  {% include "messages.html" %}
    
 <form action="/login" method="post">
    
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="email" name="email" placeholder="Enter Email" required> 
    </div>
    
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="password" name="pass1" placeholder="Enter Password" required> 
    </div><br>
    

    <div class="d-grid gap-3">
        <button type="submit" class="btn btn-primary">Login</button>
    </div>
    
    <div class="text-center mt-3">
        <small class="mb-0 text-muted">Don't have an account? <a href="/signup" class="text-decoration-none fw-bold">Sign up here</a></small>
    </div>


 </form>

</div>
{% endblock form %}
