{% extends "auth.html" %}
{% block title %} Edit Profile {% endblock title %}
{% block form %}

<h1 class="text-center">Edit Profile</h1>
<div class="card p-3">

  {% include "messages.html" %}
    
 <form action="/updateprofile/{{ userdata.user_id }}" method="post" enctype="multipart/form-data">
    
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="text" name="fname" placeholder="Enter First Name" value="{{ userdata.first_name }}" required> 
    </div>
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="text" name="lname" placeholder="Enter Last Name" value="{{ userdata.last_name }}" required> 
    </div>
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="email" name="email" placeholder="Enter Email" value="{{ userdata.email }}" required> 
    </div>
    <div class="form-group">
        <input class="form-control mb-2 p-3" type="number" name="phone" placeholder="Enter Phone Number" value="{{ userdata.phone }}" required> 
    </div>
    <div class="form-group">
        <label class="fw-bold mb-2">Profile Picture URL</label>
        <input class="form-control mb-2 p-3" type="url" name="profile_url" placeholder="https://example.com/your-image.jpg"> 
    </div>

    <div class="d-grid gap-3">
        <button type="submit" class="btn btn-primary">Update Profile</button>
    </div>


 </form>

</div>
{% endblock form %}
