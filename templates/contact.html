{% extends "auth.html" %}
{% block title %} Contact {% endblock title %}
{% block form %}

<h1 class="text-center">Contact Us</h1>
<div class="card p-3">

  {% include "messages.html" %}
    
 <form action="/contact/" method="post"  >
    
    <div class="form-group m-"> 
        <input class="form-control  mb-2 p-3 " type="email" name="email" placeholder="Enter Email" required> <!-- -->
    </div>
    
    <div class="form-group ">
        <textarea name="desc" id="" class="form-control mb-3" cols="10" rows="10" required></textarea>
    </div>

    <div class="d-grid gap-3">
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>


 </form>

</div>
{% endblock form %}
